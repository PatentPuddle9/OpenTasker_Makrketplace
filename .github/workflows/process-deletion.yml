name: Process Marketplace package deletion

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: marketplace-package-deletion
  cancel-in-progress: false

jobs:
  delete:
    name: Verify publisher and withdraw package
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted Marketplace main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Verify publisher and process deletion
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python tools/process_deletion_request.py
