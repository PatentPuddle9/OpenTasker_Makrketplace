name: Publish signed marketplace catalogue

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "moderation/**"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: official-marketplace-catalogue-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build and sign catalogue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Marketplace Python tools
        run: |
          python -m py_compile \
            tools/build_catalog.py \
            tools/validate_pr.py \
            tools/validate_marketplace.py \
            tools/process_deletion_request.py \
            tools/process_marketplace_community.py

      - name: Run Marketplace image security regression tests
        run: python -m unittest discover -s tools -p "test_*.py" -v

      - name: Build and publish from the latest main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          MARKETPLACE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.MARKETPLACE_SIGNING_PRIVATE_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Catalogue publish attempt $attempt/3"
            git fetch origin main
            git reset --hard origin/main

            python tools/build_catalog.py
            bash tools/sign_catalog.sh

            git add catalog/v1/index.json catalog/v1/index.sig
            if git diff --cached --quiet; then
              echo "Catalogue is already up to date."
              exit 0
            fi

            git commit -m "Publish signed marketplace catalogue"
            if git push origin HEAD:main; then
              echo "Published signed Marketplace catalogue."
              exit 0
            fi

            echo "main changed during publishing; fetching the latest state and rebuilding."
          done

          echo "::error::Could not publish the catalogue after three attempts."
          exit 1
